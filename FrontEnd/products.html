<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos y Categorias</title>
    <link rel="stylesheet" href="Css/products.css">
</head>
<body>
    <header>
        <div>
            <img src="Iconos/lista-del-portapapeles.svg" alt="Logo">
        </div>
    </header>
    <main>
        <section>
            <h1> Productos y Categorias</h1>
        </section>
           <h2>Cargar Productos</h2>
            <div class="caja-Productos">
            <form action="cargarProducto" method="post">
                <label for="categoria">Categoria:</label><br>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecciona una categoria</option>
                    <option value="Categoria 1">Categoria 1</option>
                    <option value="Categoria 2">Categoria 2</option>
                    <option value="Categoria 3">Categoria 3</option>
                </select><br><br>
                <label for="nombre">Nombre del Producto:</label>
                <label for="Producto">Producto:</label><br>
                <select id="Producto" name="Producto" required>
                    <option value="">Selecciona un producto</option>
                    <option value="Producto 1">Producto 1</option>
                    <option value="Producto 2">Producto 2</option>
                    <option value="Producto 3">Producto 3</option>
                </select><br><br>
                <label for="Precio">Precio:</label><br>
                <input type="number" id="Precio" name="Precio" placeholder="Ingresa el precio del producto" required><br><br>
            </form>
            </div>
        <section>

        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
